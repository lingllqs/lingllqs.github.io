        <h2 id="rip-协议简介">RIP 协议简介</h2>
<ul>
<li>RIP 协议是一种分布式的，基于距离向量的路由选择协议</li>
<li>运行 RIP 协议的路由器，维护从它自己到其他每一个目的网络的距离记录</li>
<li>选择最少路由的路径</li>
<li>仅合相邻的路由器交换信息</li>
<li>以跳数表示距离</li>
</ul>
