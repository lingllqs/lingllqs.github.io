    <h1>CRC校验</h1>
    
    <time>2023-11-08</time>
    
    <div>
        <h3 id="crc-循环冗余校验">CRC 循环冗余校验</h3>
<div class="highlight"><pre tabindex="0" style="color:#f8f8f2;background-color:#272822;-moz-tab-size:4;-o-tab-size:4;tab-size:4;-webkit-text-size-adjust:none;"><code class="language-c++" data-lang="c++"><span style="display:flex;"><span><span style="color:#ae81ff">1.</span> <span style="color:#960050;background-color:#1e0010">选择一个生成多项式</span> G(x)
</span></span><span style="display:flex;"><span><span style="color:#ae81ff">2.</span> <span style="color:#960050;background-color:#1e0010">根据</span> G(x) <span style="color:#960050;background-color:#1e0010">得到除数</span>
</span></span><span style="display:flex;"><span><span style="color:#ae81ff">3.</span> <span style="color:#960050;background-color:#1e0010">计算除数的位数</span> n
</span></span><span style="display:flex;"><span><span style="color:#ae81ff">4.</span> <span style="color:#960050;background-color:#1e0010">被除数为原始数据的比特流左移</span> n <span style="color:#f92672">-</span> <span style="color:#ae81ff">1</span> <span style="color:#960050;background-color:#1e0010">位</span>
</span></span><span style="display:flex;"><span><span style="color:#ae81ff">5.</span> <span style="color:#960050;background-color:#1e0010">被除数与除数相除得到余数</span>(<span style="color:#960050;background-color:#1e0010">异或运算</span>)
</span></span><span style="display:flex;"><span><span style="color:#ae81ff">6.</span> <span style="color:#960050;background-color:#1e0010">实际发送数据为原始数据的比特流后面附加上余数的比特流</span>
</span></span><span style="display:flex;"><span><span style="color:#ae81ff">7.</span> <span style="color:#960050;background-color:#1e0010">接收方使用收到的数据的比特流与</span> G(x) <span style="color:#960050;background-color:#1e0010">得到的除数相除</span>
</span></span><span style="display:flex;"><span><span style="color:#ae81ff">8.</span> <span style="color:#960050;background-color:#1e0010">判断余数，为</span> <span style="color:#ae81ff">0</span> <span style="color:#960050;background-color:#1e0010">则传输数据无误，否则表示数据传输过程出现错误</span>
</span></span></code></pre></div>
